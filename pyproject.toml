[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calibrick"
version = "0.1.0"
description = "Printer-calibrated STLs for brick-compatible parts and whole sets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "manifold3d>=2.5",
    "trimesh>=4.0",
    "rectpack>=0.2",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[project.scripts]
calibrick = "calibrick.cli:main"

[tool.setuptools.packages.find]
include = ["calibrick*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
